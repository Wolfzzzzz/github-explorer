<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub 资源探索台</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#fbfcfd; --text:#111827; --muted:#6b7280;
  --border:#e5e7eb; --border2:#d1d5db; --accent:#2563eb; --accent-soft:#eff6ff;
  --star:#f59e0b; --fork:#8b5cf6; --ok:#10b981; --danger:#ef4444;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 4px 14px rgba(16,24,40,.05);
  --shadow-lg:0 8px 32px rgba(16,24,40,.12); --radius:12px;
}
[data-theme="dark"]{
  --bg:#0e1116; --panel:#161a22; --panel2:#1b202a; --text:#e5e7eb; --muted:#9aa3b2;
  --border:#252b36; --border2:#333b49; --accent:#60a5fa; --accent-soft:#1c2534;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  --shadow-lg:0 8px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  transition:background .18s linear,color .18s linear;}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:6px}

#boot{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:18px;
  transition:opacity .3s linear}
#boot.hide{opacity:0;pointer-events:none}
#boot .logo{font-size:26px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}
#boot .logo i{width:12px;height:12px;border-radius:50%;background:var(--accent);
  animation:pulse 1.2s linear infinite}
@keyframes pulse{0%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.5}100%{transform:scale(1);opacity:1}}
#boot .bar{width:min(340px,70vw);height:6px;border-radius:6px;background:var(--panel2);
  border:1px solid var(--border);overflow:hidden}
#boot .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#60a5fa);
  transition:width .2s linear}
#boot .tip{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}

header{position:sticky;top:0;z-index:60;background:var(--panel);
  border-bottom:1px solid var(--border);padding:10px 18px}
.hrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-size:16px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpi{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:4px 10px;
  display:flex;align-items:baseline;gap:5px}
.kpi b{font-size:14px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.kpi span{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--panel2);padding:3px;border-radius:9px;border:1px solid var(--border)}
.tab{padding:6px 13px;border-radius:7px;border:none;background:transparent;color:var(--muted);
  font-weight:600;font-size:13px;transition:background .12s linear,color .12s linear}
.tab.active{background:var(--accent);color:#fff}
.tab:hover:not(.active){background:var(--border);color:var(--text)}
.icon-btn{padding:6px 11px;border-radius:8px;border:1px solid var(--border);background:var(--panel);
  color:var(--text);font-weight:600;font-size:13px;transition:background .12s linear,transform .1s linear}
.icon-btn:hover{background:var(--accent-soft);border-color:var(--accent)}
.icon-btn:active{transform:scale(.96)}

.controls{position:sticky;top:52px;z-index:50;background:var(--panel);
  border-bottom:1px solid var(--border);padding:10px 18px;display:none}
.controls.show{display:block}
.search-wrap{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.search{flex:1;min-width:200px;padding:9px 13px;border-radius:9px;border:1px solid var(--border2);
  background:var(--panel2);color:var(--text);font-size:14px;outline:none;
  transition:border-color .12s linear,box-shadow .12s linear}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.filter-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:7px}
.fgroup{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.flabel{font-size:12px;color:var(--muted);font-weight:600}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--panel2);
  color:var(--muted);font-size:12px;font-weight:600;transition:all .12s linear;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip .n{opacity:.65;font-weight:500;margin-left:3px}
select{padding:5px 9px;border-radius:7px;border:1px solid var(--border2);background:var(--panel2);
  color:var(--text);font-size:12px;font-weight:600;outline:none}
input[type=range]{width:120px;accent-color:var(--accent)}
.star-val{font-size:12px;color:var(--muted);min-width:48px;font-variant-numeric:tabular-nums}
.link-btn{background:none;border:none;color:var(--accent);font-size:12px;font-weight:600;padding:2px 4px}
.hist{display:flex;gap:5px;align-items:center;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.hist button{padding:2px 8px;border-radius:14px;border:1px dashed var(--border2);background:none;
  color:var(--muted);font-size:11.5px}

.resbar{display:flex;align-items:center;gap:10px;padding:8px 18px;font-size:12px;color:var(--muted);
  border-bottom:1px solid var(--border);background:var(--panel2);flex-wrap:wrap}
.resbar b{color:var(--text);font-variant-numeric:tabular-nums}
.pager{display:flex;align-items:center;gap:6px;margin-left:auto}
.pgbtn{padding:4px 10px;border-radius:7px;border:1px solid var(--border);background:var(--panel);
  color:var(--text);font-size:12px;font-weight:600;transition:all .12s linear}
.pgbtn:disabled{opacity:.4;cursor:not-allowed}
.pgbtn:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.pgnum{font-size:12px;font-variant-numeric:tabular-nums;min-width:80px;text-align:center}
.pgjump{width:54px;padding:3px 6px;border:1px solid var(--border2);border-radius:6px;background:var(--panel2);color:var(--text);font-size:12px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;padding:14px 18px 90px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:13px;box-shadow:var(--shadow);cursor:pointer;position:relative;
  animation:cardIn .22s linear both;
  transition:transform .12s linear,box-shadow .12s linear,border-color .12s linear}
@keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--accent)}
.card.fav{border-color:var(--star)}
.card-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.rname{font-weight:700;font-size:14px;line-height:1.3;word-break:break-all;flex:1}
.rname .owner{color:var(--muted);font-weight:500}
.favbtn{border:none;background:none;font-size:16px;line-height:1;padding:2px;color:var(--border2);
  transition:color .12s linear,transform .12s linear}
.favbtn:hover{transform:scale(1.2)}
.favbtn.on{color:var(--star)}
.quick{display:flex;gap:3px;align-items:center;opacity:0;transition:opacity .12s linear}
.card:hover .quick,.row:hover .quick{opacity:1}
.qbtn{border:1px solid var(--border);background:var(--panel2);border-radius:6px;font-size:11px;
  padding:1px 6px;color:var(--muted);line-height:1.5}
.qbtn:hover{border-color:var(--accent);color:var(--accent)}
.desc{font-size:12.5px;color:var(--muted);margin-bottom:9px;display:-webkit-box;
  -webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.meta{display:flex;gap:9px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.badge{padding:2px 7px;border-radius:5px;background:var(--panel2);border:1px solid var(--border);font-weight:600}
.lang{display:inline-flex;align-items:center;gap:4px}
.lang i{width:8px;height:8px;border-radius:50%;display:inline-block}
.stars{color:var(--star);font-weight:700}
.tagdir{padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:11px}
.hl{font-size:11.5px;background:var(--accent-soft);border-left:3px solid var(--accent);
  padding:6px 8px;border-radius:0 6px 6px 0;margin-top:8px}
.hl b{color:var(--accent)}
mark{background:#fde68a;color:#111827;border-radius:2px;padding:0 1px}
[data-theme="dark"] mark{background:#78350f;color:#fde68a}
body.dense .grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
body.dense .card{padding:9px}
body.dense .desc{-webkit-line-clamp:2;min-height:32px}

.list{display:flex;flex-direction:column;gap:6px;padding:12px 18px 90px}
.row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--border);
  border-radius:8px;padding:9px 12px;cursor:pointer;transition:border-color .12s linear,background .12s linear;
  animation:cardIn .2s linear both}
.row:hover{border-color:var(--accent);background:var(--panel2)}
.row .rname{font-size:13px;flex:0 0 250px}
.row .desc{flex:1;min-height:auto;-webkit-line-clamp:1;margin:0}
.tblwrap{padding:12px 18px 90px;overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);
  border-radius:8px;overflow:hidden;font-size:12.5px}
table.tbl th{background:var(--panel2);text-align:left;padding:8px 10px;font-weight:700;color:var(--muted);
  border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap}
table.tbl th:hover{color:var(--accent)}
table.tbl td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
table.tbl tr:hover td{background:var(--panel2)}
table.tbl td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.sk{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:13px}
.sk i{display:block;height:11px;border-radius:5px;margin-bottom:8px;
  background:linear-gradient(90deg,var(--panel2) 25%,var(--border) 37%,var(--panel2) 63%);
  background-size:400% 100%;animation:shimmer 1.3s linear infinite}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:80;opacity:0;pointer-events:none;
  transition:opacity .15s linear}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(440px,92vw);background:var(--panel);
  border-left:1px solid var(--border);z-index:90;transform:translateX(100%);
  transition:transform .2s linear;overflow-y:auto;box-shadow:var(--shadow-lg)}
.drawer.show{transform:translateX(0)}
.dhead{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px}
.dhead h3{margin:0;font-size:16px;flex:1;word-break:break-all;line-height:1.35}
.dbody{padding:16px 18px 40px}
.dsec{margin-bottom:16px;animation:cardIn .2s linear both}
.dsec .k{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kv div{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.kv .l{font-size:11px;color:var(--muted)}
.kv .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);
  color:#fff;font-weight:700;font-size:13px;transition:opacity .12s linear,transform .1s linear}
.btn:hover{opacity:.88}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--panel);color:var(--text);border-color:var(--border2)}
.closebtn{border:none;background:var(--panel2);color:var(--muted);font-size:18px;width:30px;height:30px;
  border-radius:7px;line-height:1}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-48%) scale(.97);z-index:95;
  background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);
  width:min(940px,94vw);max-height:84vh;overflow-y:auto;opacity:0;pointer-events:none;
  transition:opacity .15s linear,transform .15s linear}
.modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.mhead{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;
  position:sticky;top:0;background:var(--panel)}
.mhead h3{margin:0;font-size:15px;flex:1}
.mbody{padding:16px 18px}
.cmpbar{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--border);
  padding:9px 18px;display:none;align-items:center;gap:10px;z-index:70}
.cmpbar.show{display:flex}
.cmplist{display:flex;gap:6px;flex-wrap:wrap;flex:1;font-size:12px}
.cmpitem{padding:3px 9px;background:var(--accent-soft);color:var(--accent);border-radius:20px;font-weight:600;border:1px solid var(--accent)}

.sec{padding:16px 18px 60px;display:none}
.sec.show{display:block;animation:cardIn .22s linear both}
h2.st{font-size:17px;margin:0 0 4px}
p.sub{margin:0 0 14px;color:var(--muted);font-size:12.5px}
.tgroup{margin-bottom:22px}
.tgroup h3{font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.tcard{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:11px 13px;
  display:flex;gap:10px;align-items:flex-start;transition:border-color .12s linear,transform .12s linear;
  animation:cardIn .2s linear both}
.tcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.tcard .info{flex:1;min-width:0}
.tcard .nm{font-weight:700;font-size:13px;word-break:break-all}
.tside{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ins{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;
  margin-bottom:12px;border-left:3px solid var(--accent);animation:cardIn .2s linear both}
.bars{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.bar{display:flex;align-items:center;gap:10px;font-size:12px}
.bar .lb{flex:0 0 168px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{flex:1;background:var(--panel2);border-radius:5px;height:18px;overflow:hidden;border:1px solid var(--border)}
.bar .fl{height:100%;background:linear-gradient(90deg,var(--accent),#60a5fa);transition:width .4s linear}
.bar .vl{flex:0 0 68px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.kpiCards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.kpiCard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;
  box-shadow:var(--shadow);animation:cardIn .22s linear both}
.kpiCard .k{font-size:11px;color:var(--muted);font-weight:600}
.kpiCard .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:-.6px}
.empty{padding:56px 20px;text-align:center;color:var(--muted);animation:cardIn .2s linear both}
.empty .big{font-size:38px;margin-bottom:8px}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--text);color:var(--bg);padding:9px 18px;border-radius:9px;z-index:300;
  font-weight:700;font-size:13px;opacity:0;transition:opacity .15s linear,transform .15s linear;
  box-shadow:var(--shadow-lg);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
#top{position:fixed;right:18px;bottom:74px;z-index:75;width:40px;height:40px;border-radius:50%;
  border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:17px;
  opacity:0;pointer-events:none;transition:opacity .15s linear;box-shadow:var(--shadow)}
#top.show{opacity:1;pointer-events:auto}
kbd{background:var(--panel2);border:1px solid var(--border2);border-bottom-width:2px;border-radius:5px;
  padding:1px 5px;font-family:ui-monospace,Menlo,monospace;font-size:11px}
.hint{padding:7px 18px;background:var(--accent-soft);color:var(--accent);font-size:12px;border-bottom:1px solid var(--border)}
@media(max-width:640px){.row .desc{display:none}.row .rname{flex:1}.tabs{width:100%;margin:6px 0 0}}
</style>
</head>
<body>

<!--DATA_SCRIPTS-->
<div id="boot">
  <div class="logo"><i></i>GitHub 资源探索台</div>
  <div class="bar"><i id="bootBar"></i></div>
  <div class="tip" id="bootTip">正在加载数据…</div>
</div>

<header>
  <div class="hrow">
    <div class="brand"><span class="dot"></span>GitHub 资源探索台<span class="t" style="font-weight:500;color:var(--muted);font-size:12px">· 开源资源导航</span></div>
    <div class="kpis" id="kpis"></div>
    <div class="tabs">
      <button class="tab active" data-tab="lib">🗂 仓库库</button>
      <button class="tab" data-tab="trend">🔥 趋势榜</button>
      <button class="tab" data-tab="insight">💡 洞察建议</button>
      <button class="tab" data-tab="stats">📊 统计</button>
      <button class="tab" data-tab="fav">⭐ 收藏</button>
    </div>
    <button class="icon-btn" id="themeBtn" title="切换主题 (T)">🌙</button>
  </div>
</header>

<div class="controls show" id="controls">
  <div class="search-wrap">
    <input class="search" id="q" placeholder="搜索仓库名 / 作者 / 简介 / 语言 / 标签…（空格分隔多词 AND）">
    <button class="icon-btn" id="exportBtn">导出</button>
    <button class="icon-btn" id="resetBtn">重置</button>
  </div>
  <div class="search-wrap" style="margin-top:7px">
    <input class="search" id="onlineQ" placeholder="🌐 在线实时搜索 GitHub，结果并入本页（支持 stars:>5000 language:swift 等语法）">
    <button class="icon-btn" id="onlineBtn" style="font-weight:700;border-color:var(--accent);color:var(--accent)">🌐 搜索</button>
    <button class="icon-btn" id="tokenBtn" title="可选：填 GitHub Token 后速率 10→30 次/分，仅存本地">🔑 Token</button>
  </div>
  <div class="hist" id="hist"></div>
  <div class="filter-row">
    <div class="fgroup"><span class="flabel">方向</span>
      <input class="search" id="dirSearch" placeholder="搜索方向…" style="flex:0 0 130px;padding:3px 9px;font-size:11.5px;min-width:0">
      <div class="chips" id="dirChips"></div>
      <button class="link-btn" id="dirAll">全选</button><button class="link-btn" id="dirNone">清空</button></div>
  </div>
  <div class="filter-row">
    <div class="fgroup"><span class="flabel">语言</span><div class="chips" id="langChips"></div></div>
    <div class="fgroup"><span class="flabel">★≥</span>
      <input type="range" id="starRange" min="0" max="100" step="1" value="0">
      <span class="star-val" id="starVal">0</span></div>
    <div class="fgroup"><span class="flabel">更新</span>
      <select id="sinceSel"><option value="">全部</option><option value="30">近 1 月</option>
        <option value="90">近 3 月</option><option value="365">近 1 年</option></select></div>
    <div class="fgroup"><span class="flabel">排序</span>
      <select id="sortSel"><option value="stars-desc">★ 高→低</option><option value="stars-asc">★ 低→高</option>
        <option value="forks-desc">Fork 多→少</option><option value="updated-desc">最近更新</option>
        <option value="created-desc">最新创建</option><option value="name-asc">名称 A→Z</option>
        <option value="random">🎲 随机</option></select></div>
    <div class="fgroup"><span class="flabel">视图</span>
      <select id="viewSel"><option value="card">卡片</option><option value="list">紧凑</option><option value="table">表格</option></select></div>
    <div class="fgroup"><span class="flabel">每页</span>
      <select id="perSel"><option>24</option><option selected>48</option><option>96</option><option>200</option><option value="9999">全部</option></select></div>
    <div class="fgroup"><span class="flabel">密度</span>
      <select id="denseSel"><option value="">舒适</option><option value="dense">紧凑</option></select></div>
    <label class="fgroup" style="font-size:12px;font-weight:600;cursor:pointer"><input type="checkbox" id="favOnly"> 仅收藏</label>
    <label class="fgroup" style="font-size:12px;font-weight:600;cursor:pointer"><input type="checkbox" id="hlOnly"> 仅⭐推荐</label>
  </div>
</div>

<div class="hint" id="hintBar">
  快捷键：<kbd>/</kbd> 搜索 · <kbd>R</kbd> 随机 · <kbd>F</kbd> 仅收藏 · <kbd>←→</kbd> 翻页 · <kbd>C</kbd> 重置 · <kbd>T</kbd> 主题 · <kbd>1</kbd>-<kbd>5</kbd> 切页 · <kbd>Esc</kbd> 关闭
</div>

<div class="resbar" id="resbar">
  <span id="resStat"></span>
  <button class="pgbtn" id="randBtn" title="从当前结果随机挑一个">🎲 随机发现</button>
  <button class="pgbtn" id="reshuffleBtn" title="重新打乱顺序" style="display:none">🔀 换一批</button>
  <button class="pgbtn" id="selPageCmp" title="把本页全部加入对比篮">☑ 本页对比</button>
  <button class="pgbtn" id="selPageFav" title="收藏本页全部">★ 本页收藏</button>
  <div class="pager">
    <button class="pgbtn" id="pgPrev">← 上一页</button>
    <span class="pgnum" id="pgNum"></span>
    <button class="pgbtn" id="pgNext">下一页 →</button>
    <input class="pgjump" id="pgJump" type="number" min="1" placeholder="跳页">
  </div>
</div>

<main id="mainLib">
  <div class="grid" id="grid"></div>
  <div class="list" id="list" style="display:none"></div>
  <div class="tblwrap" id="tblwrap" style="display:none"></div>
</main>

<section class="sec" id="secTrend"></section>
<section class="sec" id="secInsight"></section>
<section class="sec" id="secStats"></section>
<section class="sec" id="secFav"></section>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer"></aside>
<div class="cmpbar" id="cmpbar">
  <strong style="font-size:12px">对比篮</strong>
  <div class="cmplist" id="cmplist"></div>
  <button class="btn" id="cmpGo">对比</button>
  <button class="btn sec" id="cmpClear">清空</button>
</div>
<div class="modal" id="modal"></div>
<button id="top" title="回到顶部">↑</button>
<div class="toast" id="toast"></div>

<script>
const DATA = /*__META__*/ {};

/* ===== 基础 ===== */
const ALL = (window.__CHUNKS__||[]).flatMap(c => c.repos || []);
const HLS = DATA.highlights || {};
const state = {q:'',dirs:new Set(),langs:new Set(),minStar:0,since:'',sort:'stars-desc',
  view:'card',page:1,per:48,favOnly:false,hlOnly:false,randSeed:0,dirFilter:''};
let SHUF = new Map(), shufSeed = -1;
function ensureShuffle(){
  if(shufSeed === state.randSeed && SHUF.size) return;
  shufSeed = state.randSeed; SHUF = new Map();
  for(const r of ALL) SHUF.set(r.url, Math.random());
}
let favs = new Set(JSON.parse(localStorage.getItem('gh_favs')||'[]'));
let cmp = new Set();
let hist = JSON.parse(localStorage.getItem('gh_hist')||'[]');
let dirsExpanded = false, IDX = null;
const saveFavs = () => localStorage.setItem('gh_favs', JSON.stringify([...favs]));

const LANGCOLOR = {'Swift':'#F05138','Python':'#3572A5','JavaScript':'#f1e05a','TypeScript':'#3178c6',
 'Go':'#00ADD8','Rust':'#dea584','Java':'#b07219','Kotlin':'#A97BFF','C++':'#f34b7d','C':'#555555',
 'C#':'#178600','PHP':'#4F5D95','Ruby':'#701516','Shell':'#89e051','HTML':'#e34c26','CSS':'#563d7c',
 'Vue':'#41b883','Dart':'#00B4AB','—':'#9ca3af'};
const lc = l => LANGCOLOR[l] || '#8b949e';
const esc = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n>=1000 ? (n/1000).toFixed(n>=10000?0:1)+'k' : String(n);
const fnum = n => n.toLocaleString('en-US');
const ago = d => { if(!d) return '—';
  const days = Math.floor((Date.now()-new Date(d))/864e5);
  if(days<1) return '今天'; if(days<30) return days+'天前';
  if(days<365) return Math.floor(days/30)+'个月前'; return Math.floor(days/365)+'年前'; };
const ymd = d => d ? new Date(d).toISOString().slice(0,10) : '—';
const hlKey = r => r.owner + '/' + r.name;
const hlText = r => HLS[hlKey(r)] || '';
function mark(text, terms){
  let s = esc(text||'');
  if(!terms.length) return s;
  terms.forEach(t => { if(!t) return;
    const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','gi');
    s = s.replace(re,'<mark>$1</mark>'); });
  return s;
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 1900);
}
function animateNum(el, target){
  const dur = 260, t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now-t0)/dur);
    el.textContent = fnum(Math.round(target*p));
    if(p<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ===== 搜索索引（懒构建，一次性） ===== */
function buildIndex(){
  if(IDX) return;
  IDX = new Array(ALL.length);
  for(let i=0;i<ALL.length;i++){
    const r = ALL[i];
    IDX[i] = (r.owner+'/'+r.name+' '+(r.description||'')+' '+r.language+' '+r.direction+' '+(r.matchedQuery||'')).toLowerCase();
  }
}

/* ===== 过滤 + 排序 ===== */
function filtered(){
  const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  if(terms.length) buildIndex();
  const out = [];
  for(let i=0;i<ALL.length;i++){
    const r = ALL[i];
    if(state.favOnly && !favs.has(hlKey(r))) continue;
    if(state.hlOnly && !hlText(r)) continue;
    if(state.dirs.size && !state.dirs.has(r.direction)) continue;
    if(state.langs.size && !state.langs.has(r.language)) continue;
    if(r.stars < state.minStar) continue;
    if(state.since){
      const d = Math.floor((Date.now()-new Date(r.updatedAt))/864e5);
      if(d > +state.since) continue;
    }
    if(terms.length){
      const hay = IDX[i];
      let ok = true;
      for(const t of terms){ if(hay.indexOf(t) < 0){ ok = false; break; } }
      if(!ok) continue;
    }
    out.push(r);
  }
  const [k, d] = state.sort.split('-');
  if(k === 'random') ensureShuffle();
  out.sort((a,b) => {
    if(k === 'random') return (SHUF.get(a.url)||0) - (SHUF.get(b.url)||0);
    let x, y;
    if(k==='stars'){ x=a.stars; y=b.stars; }
    else if(k==='forks'){ x=a.forks; y=b.forks; }
    else if(k==='updated'){ x=new Date(a.updatedAt); y=new Date(b.updatedAt); }
    else if(k==='created'){ x=new Date(a.createdAt); y=new Date(b.createdAt); }
    else return d==='asc' ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name);
    return d==='asc' ? x-y : y-x;
  });
  return out;
}

/* ===== 渲染 ===== */
let lastSlice = [];
let curIdx = -1;
function render(){
  const rows = filtered();
  lastRows = rows;
  const total = rows.length, pages = Math.max(1, Math.ceil(total/state.per));
  if(state.page > pages) state.page = pages;
  const slice = state.per >= 9999 ? rows : rows.slice((state.page-1)*state.per, state.page*state.per);
  const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  const sumS = rows.reduce((s,r)=>s+r.stars,0);

  document.getElementById('resStat').innerHTML =
    `匹配 <b>${fnum(total)}</b> / ${fnum(ALL.length)} 个仓库 · 合计 <b>${fmt(sumS)}</b> ★ · 平均 <b>${total?Math.round(sumS/total):0}</b> ★`;
  document.getElementById('pgNum').textContent = `第 ${state.page} / ${pages} 页`;
  document.getElementById('pgPrev').disabled = state.page <= 1;
  document.getElementById('pgNext').disabled = state.page >= pages;
  lastSlice = slice;
  document.getElementById('reshuffleBtn').style.display = state.sort === 'random' ? '' : 'none';

  const card = r => `
    <div class="card ${favs.has(hlKey(r))?'fav':''}" data-k="${hlKey(r)}">
      <div class="card-top">
      <div class="rname">${mark(r.owner,terms)}<span class="owner">/</span>${mark(r.name,terms)}</div>
      <div class="quick">
        <button class="qbtn" data-open="${r.url}" title="打开 GitHub">↗</button>
        <button class="qbtn" data-copy="${r.url}" title="复制链接">⧉</button>
      </div>
      <button class="favbtn ${favs.has(hlKey(r))?'on':''}" data-fav="${hlKey(r)}" title="收藏">★</button>
    </div>
    <div class="desc">${mark(r.description,terms)}</div>
      <div class="meta">
        <span class="stars">★ ${fmt(r.stars)}</span>
        <span>⑂ ${fmt(r.forks)}</span>
        <span class="lang"><i style="background:${lc(r.language)}"></i>${esc(r.language)}</span>
        <span class="tagdir">${esc(r.direction)}</span>
        <span>更新 ${ago(r.updatedAt)}</span>
      </div>
      ${hlText(r) ? `<div class="hl"><b>⭐ 推荐 ·</b> ${esc(hlText(r))}</div>` : ''}
    </div>`;
  const row = r => `
    <div class="row" data-k="${hlKey(r)}">
      <div class="rname">${mark(r.owner,terms)}/${mark(r.name,terms)}</div>
      <div class="desc">${mark(r.description,terms)}</div>
      <div class="meta"><span class="stars">★ ${fmt(r.stars)}</span>
        <span class="lang"><i style="background:${lc(r.language)}"></i>${esc(r.language)}</span>
        <span class="tagdir">${esc(r.direction)}</span>
        <button class="favbtn ${favs.has(hlKey(r))?'on':''}" data-fav="${hlKey(r)}">★</button></div>
    </div>`;

  const g = document.getElementById('grid'), l = document.getElementById('list'), t = document.getElementById('tblwrap');
  if(state.view === 'card'){
    g.innerHTML = slice.length ? slice.map(card).join('') : emptyHTML(terms);
    g.style.display=''; l.style.display='none'; t.style.display='none';
  } else if(state.view === 'list'){
    l.innerHTML = slice.length ? slice.map(row).join('') : emptyHTML(terms);
    g.style.display='none'; l.style.display=''; t.style.display='none';
  } else {
    g.style.display='none'; l.style.display='none'; t.style.display='';
    t.innerHTML = slice.length ? `<table class="tbl"><thead><tr>
      <th data-s="name-asc">仓库</th><th>简介</th><th data-s="stars-desc">★</th><th data-s="forks-desc">Fork</th>
      <th>语言</th><th>方向</th><th data-s="updated-desc">更新</th></tr></thead><tbody>
      ${slice.map(r=>`<tr data-k="${hlKey(r)}"><td><b>${mark(r.owner+'/'+r.name,terms)}</b><br>
        <button class="favbtn ${favs.has(hlKey(r))?'on':''}" data-fav="${hlKey(r)}">★</button>
        <input type="checkbox" data-cmp="${hlKey(r)}" ${cmp.has(hlKey(r))?'checked':''} title="加入对比"></td>
        <td>${mark(r.description,terms)}</td><td class="num">${fnum(r.stars)}</td><td class="num">${fnum(r.forks)}</td>
        <td>${esc(r.language)}</td><td>${esc(r.direction)}</td><td class="num">${ymd(r.updatedAt)}</td></tr>`).join('')}
      </tbody></table>` : emptyHTML(terms);
  }
  buildChips();
  renderKpis(rows);
  syncHash();
}
function emptyHTML(terms){
  const any = state.q || state.dirs.size || state.langs.size || state.minStar || state.since || state.favOnly || state.hlOnly;
  return `<div class="empty" style="grid-column:1/-1">
    <div class="big">${any?'🔍':'📭'}</div>
    <div>${any?'没有匹配的仓库':'这里还没有数据'}</div>
    ${any?'<div style="margin-top:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn sec" id="clearAll">清空全部筛选</button><button class="btn sec" id="showHl">看看 ⭐ 推荐项目</button><button class="btn sec" id="tryRandom">随便逛逛</button></div>':''}
  </div>`;
}
const _qbtn = (d, label) => `<button class="qbtn" ${d} title="${label}">${label === '打开 GitHub' ? '↗' : '⧉'}</button>`;
function renderKpis(rows){
  const sum = rows.reduce((s,r)=>s+r.stars,0);
  const data = [['当前结果', rows.length], ['仓库总数', ALL.length], ['方向', DATA.dirNames.length],
                ['⭐推荐', Object.keys(HLS).length], ['收藏', favs.size],
                ['更新', DATA.generatedAt.slice(5, 16)]];
  const box = document.getElementById('kpis');
  box.innerHTML = data.map(([k,v]) => `<div class="kpi"><b>${fnum(v)}</b><span>${k}</span></div>`).join('');
}
function buildChips(){
  const dc = document.getElementById('dirChips');
  const names = DATA.dirNames.filter(d => !state.dirFilter || d.toLowerCase().indexOf(state.dirFilter) >= 0);
  const show = dirsExpanded ? names : names.slice(0, 10);
  dc.innerHTML = show.map(d => {
    const n = ALL.filter(r => r.direction === d).length;
    return `<button class="chip ${state.dirs.has(d)?'on':''}" data-dir="${esc(d)}">${esc(d)}<span class="n">${n}</span></button>`;
  }).join('') + (names.length > 10 ? `<button class="chip" id="dirMore" style="border-style:dashed">${dirsExpanded?'收起 ▲':'⋯ 全部 '+names.length+' ▼'}</button>` : '');
  const lc2 = document.getElementById('langChips');
  lc2.innerHTML = DATA.topLangs.map(x => x[0]).map(l => {
    const n = ALL.filter(r => r.language === l).length;
    return `<button class="chip ${state.langs.has(l)?'on':''}" data-lang="${esc(l)}">${esc(l)}<span class="n">${n}</span></button>`;
  }).join('');
}
function renderHist(){
  const box = document.getElementById('hist');
  if(!hist.length){ box.innerHTML = ''; return; }
  box.innerHTML = '<span>最近搜索：</span>' + hist.map(h =>
    `<button data-h="${esc(h)}">${esc(h)}</button>`).join('');
}
function pushHist(q){
  q = q.trim();
  if(!q || q.length < 2) return;
  hist = [q].concat(hist.filter(x => x !== q)).slice(0, 6);
  localStorage.setItem('gh_hist', JSON.stringify(hist));
  renderHist();
}

/* ===== URL 同步 ===== */
function syncHash(){
  const p = [];
  if(state.q) p.push('q=' + encodeURIComponent(state.q));
  if(state.dirs.size) p.push('dir=' + encodeURIComponent([...state.dirs].join(',')));
  if(state.langs.size) p.push('lang=' + encodeURIComponent([...state.langs].join(',')));
  if(state.sort !== 'stars-desc') p.push('sort=' + state.sort);
  if(state.view !== 'card') p.push('view=' + state.view);
  if(state.minStar) p.push('min=' + state.minStar);
  const h = p.length ? '#' + p.join('&') : '';
  if(location.hash !== h) history.replaceState(null, '', h);
}
function readHash(){
  if(!location.hash || location.hash.length < 2) return;
  const m = new URLSearchParams(location.hash.slice(1));
  if(m.get('q')) state.q = m.get('q');
  if(m.get('dir')) m.get('dir').split(',').forEach(d => state.dirs.add(d));
  if(m.get('lang')) m.get('lang').split(',').forEach(l => state.langs.add(l));
  if(m.get('sort')) state.sort = m.get('sort');
  if(m.get('view')) state.view = m.get('view');
  if(m.get('min')) state.minStar = +m.get('min');
}

/* ===== 抽屉 ===== */
function openDrawer(k){
  const r = ALL.find(x => hlKey(x) === k); if(!r) return;
  const h = hlText(r);
  document.getElementById('drawer').innerHTML = `
    <div class="dhead">
      <h3>${esc(r.owner)} / ${esc(r.name)}</h3>
      <button class="closebtn" id="dClose">✕</button>
    </div>
    <div class="dbody">
      ${h ? `<div class="dsec"><div class="k">⭐ 为什么值得看</div><div class="hl" style="font-size:13px">${esc(h)}</div></div>` : ''}
      <div class="dsec"><div class="k">简介</div><div style="font-size:13px">${esc(r.description)||'—'}</div></div>
      <div class="dsec"><div class="k">数据</div><div class="kv">
        <div><div class="l">Star</div><div class="v" style="color:var(--star)">${fnum(r.stars)}</div></div>
        <div><div class="l">Fork</div><div class="v" style="color:var(--fork)">${fnum(r.forks)}</div></div>
        <div><div class="l">语言</div><div class="v" style="font-size:13px">${esc(r.language)}</div></div>
        <div><div class="l">方向</div><div class="v" style="font-size:12px">${esc(r.direction)}</div></div>
        <div><div class="l">创建</div><div class="v" style="font-size:13px">${ymd(r.createdAt)}</div></div>
        <div><div class="l">更新</div><div class="v" style="font-size:13px">${ymd(r.updatedAt)}</div></div>
      </div></div>
      <div class="dsec"><div class="k">匹配关键词</div><div class="badge">${esc(r.matchedQuery||'—')}</div></div>
      <div class="btnrow">
        <button class="btn" id="dOpen">打开 GitHub ↗</button>
        <button class="btn sec" id="dFav">${favs.has(k)?'★ 取消收藏':'☆ 收藏'}</button>
        <button class="btn sec" id="dCmp">${cmp.has(k)?'✓ 已在对比篮':'＋ 加入对比'}</button>
        <button class="btn sec" id="dCopy">复制信息</button>
        <button class="btn sec" id="dPng">🖼 存为图片</button>
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:10px">
        <button class="btn sec" id="dPrev">← 上一个</button>
        <span id="dPos" style="font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums"></span>
        <button class="btn sec" id="dNext">下一个 →</button>
      </div>
      <div class="dsec" style="margin-top:16px">
        <div class="k">相似仓库（同方向 / 同语言）</div>
        <div id="simList" style="display:flex;flex-direction:column;gap:6px;margin-top:6px"></div>
      </div>
    </div>`;
  document.getElementById('drawer').classList.add('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('dClose').onclick = closeAll;
  document.getElementById('dOpen').onclick = () => window.open(r.url, '_blank');
  document.getElementById('dFav').onclick = () => { toggleFav(k); openDrawer(k); };
  document.getElementById('dCmp').onclick = () => { toggleCmp(k); openDrawer(k); };
  document.getElementById('dCopy').onclick = () => {
    const txt = `${r.owner}/${r.name} — ${r.description}\n★${r.stars} ⑂${r.forks} | ${r.language} | ${r.direction}\n${r.url}`;
    navigator.clipboard.writeText(txt); toast('已复制');
  };
  document.getElementById('dPng').onclick = () => drawCardPNG(r);
  curIdx = lastRows.findIndex(x => hlKey(x) === k);
  document.getElementById('dPos').textContent =
    curIdx >= 0 ? `第 ${curIdx+1} / ${lastRows.length} 个` : '';
  document.getElementById('dPrev').onclick = () => {
    if(curIdx > 0) openDrawer(hlKey(lastRows[curIdx-1]));
  };
  document.getElementById('dNext').onclick = () => {
    if(curIdx >= 0 && curIdx < lastRows.length - 1) openDrawer(hlKey(lastRows[curIdx+1]));
  };
  document.getElementById('simList').innerHTML = similar(r).map(x => `
    <div class="row" data-k="${hlKey(x)}" style="padding:7px 10px">
      <div class="rname" style="flex:1;font-size:12.5px">${esc(x.owner+'/'+x.name)}</div>
      <div class="meta"><span class="stars">★ ${fmt(x.stars)}</span><span class="badge">${esc(x.language)}</span></div>
    </div>`).join('') || '<div style="color:var(--muted);font-size:12px">没有相似的</div>';
}
function similar(r){
  return ALL.filter(x => hlKey(x) !== hlKey(r) && (x.direction === r.direction || x.language === r.language))
    .map(x => ({x, s: (x.direction === r.direction ? 2 : 0) + (x.language === r.language ? 1 : 0)}))
    .sort((a,b) => b.s - a.s || b.x.stars - a.x.stars).slice(0, 6).map(o => o.x);
}
function drawCardPNG(r){
  const dark = document.documentElement.dataset.theme === 'dark';
  const BG = dark?'#161a22':'#ffffff', FG = dark?'#e5e7eb':'#111827',
        MU = dark?'#9aa3b2':'#6b7280', BD = dark?'#252b36':'#e5e7eb',
        AC = '#2563eb', ACB = dark?'#1c2534':'#eff6ff';
  const W = 900, H = 470, S = 2;
  const c = document.createElement('canvas'); c.width = W*S; c.height = H*S;
  const x = c.getContext('2d'); x.scale(S, S);
  x.fillStyle = BG; x.fillRect(0,0,W,H);
  x.strokeStyle = BD; x.lineWidth = 1; x.strokeRect(.5,.5,W-1,H-1);
  x.fillStyle = AC; x.fillRect(0,0,6,H);
  let y = 48;
  x.fillStyle = FG; x.font = '700 30px -apple-system,"PingFang SC",sans-serif';
  x.fillText(r.owner + ' / ' + r.name, 34, y);
  y += 42;
  x.font = '600 17px -apple-system,"PingFang SC",sans-serif';
  x.fillStyle = '#f59e0b'; x.fillText('★ ' + fnum(r.stars), 34, y);
  x.fillStyle = '#8b5cf6'; x.fillText('⑂ ' + fnum(r.forks), 150, y);
  x.fillStyle = MU; x.fillText('· ' + r.language + ' · ' + r.direction, 280, y);
  y += 34;
  x.fillStyle = MU; x.font = '15px -apple-system,"PingFang SC",sans-serif';
  const wrap = (t, maxW, maxL) => {
    const out = []; let line = '';
    for(const ch of (t||'')){
      if(x.measureText(line+ch).width > maxW){ out.push(line); line = ch; if(out.length >= maxL-1) break; }
      else line += ch;
    }
    if(out.length < maxL) out.push(line);
    return out;
  };
  wrap(r.description || '（无简介）', W-68, 3).forEach(l => { x.fillText(l, 34, y); y += 22; });
  y += 14;
  const h = hlText(r);
  if(h){
    const lines = wrap('⭐ 推荐 · ' + h, W-84, 4);
    x.fillStyle = ACB; x.fillRect(28, y-16, W-62, 10 + lines.length*22);
    x.fillStyle = AC; x.fillRect(28, y-16, 4, 10 + lines.length*22);
    x.fillStyle = FG; x.font = '15px -apple-system,"PingFang SC",sans-serif';
    lines.forEach(l => { x.fillText(l, 42, y+4); y += 22; });
    y += 18;
  }
  x.fillStyle = MU; x.font = '13px ui-monospace,Menlo,monospace';
  x.fillText(r.url, 34, H-38);
  x.font = '12px -apple-system,sans-serif';
  x.fillText('GitHub 资源探索台 · ' + DATA.generatedAt, 34, H-18);
  c.toBlob(b => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(b);
    a.download = r.owner + '_' + r.name + '.png'; a.click(); URL.revokeObjectURL(a.href);
    toast('已保存 PNG');
  });
}

function exportData(type){
  const rows = filtered();
  let txt = '', name = '', mime = 'text/plain';
  if(type === 'md'){
    name = 'github-资源.md'; mime = 'text/markdown';
    const byDir = {};
    rows.forEach(r => { (byDir[r.direction] = byDir[r.direction] || []).push(r); });
    txt = `# GitHub 资源筛选导出（${rows.length} 个）\n\n生成：${DATA.generatedAt}\n\n`;
    Object.entries(byDir).forEach(([d, rs]) => {
      txt += `## ${d}（${rs.length}）\n\n`;
      rs.forEach(r => { txt += `- **[${r.owner}/${r.name}](${r.url})** — ${r.description||''}\n  - ★${fnum(r.stars)} · ⑂${fnum(r.forks)} · ${r.language} · 更新 ${ymd(r.updatedAt)}\n`; });
      txt += '\n';
    });
  } else if(type === 'json'){
    name = 'github-资源.json'; mime = 'application/json';
    txt = JSON.stringify(rows, null, 2);
  } else {
    name = 'github-资源.txt';
    txt = rows.map(r => `${r.owner}/${r.name} | ★${r.stars} | ${r.language} | ${r.direction} | ${r.url}`).join('\n');
  }
  if(type === 'copy'){
    navigator.clipboard.writeText(exportData('txt')); toast('已复制'); return txt;
  }
  const blob = new Blob([txt], {type: mime});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  URL.revokeObjectURL(a.href);
  toast(`已导出 ${rows.length} 条 → ${name}`);
  return txt;
}

const getToken = () => localStorage.getItem('gh_token') || '';
document.getElementById('tokenBtn').onclick = () => {
  const cur = getToken();
  const t = prompt('GitHub Personal Access Token（可选）\n\n速率：未认证 10 次/分 → 认证 30 次/分\n建议：fine-grained token、只读 Public\n仅存浏览器本地，只发给 api.github.com', cur);
  if(t !== null){
    t.trim() ? localStorage.setItem('gh_token', t.trim()) : localStorage.removeItem('gh_token');
    toast(t.trim() ? 'Token 已保存（仅本地）' : 'Token 已清除');
  }
};
async function onlineSearch(){
  const q = document.getElementById('onlineQ').value.trim();
  if(!q){ toast('先输入在线搜索词'); return; }
  const btn = document.getElementById('onlineBtn');
  btn.textContent = '⏳ 搜索中…'; btn.disabled = true;
  try{
    const headers = {'Accept':'application/vnd.github+json'};
    const tk = getToken(); if(tk) headers.Authorization = 'Bearer ' + tk;
    const url = 'https://api.github.com/search/repositories?q=' + encodeURIComponent(q) + '&sort=stars&order=desc&per_page=30';
    let res = await fetch(url, {headers});
    const rem = res.headers.get('x-ratelimit-remaining');
    if(res.status === 401){
      localStorage.removeItem('gh_token');
      toast('保存的 Token 无效，已自动清除，改用无认证模式重试');
      delete headers.Authorization;
      res = await fetch(url, {headers});
    }
    if(res.status === 403 || res.status === 429){ toast('速率限制：未认证 10 次/分，带 Token 30 次/分'); return; }
    if(!res.ok){ const e = await res.json().catch(()=>({})); toast('搜索失败：' + (e.message || res.status)); return; }
    const data = await res.json();
    const urls = new Set(ALL.map(r => r.url));
    let added = 0, skip = 0;
    for(const it of (data.items || [])){
      if(urls.has(it.html_url)){ skip++; continue; }
      urls.add(it.html_url);
      ALL.push({name:it.name, owner:(it.owner&&it.owner.login)||'', url:it.html_url,
        description:it.description||'', stars:it.stargazers_count||0, forks:it.forks_count||0,
        language:it.language||'—', updatedAt:it.updated_at||'', createdAt:it.created_at||'',
        matchedQuery:'🌐 ' + q, direction:'🌐 在线搜索'});
      added++;
    }
    if(added && !DATA.dirNames.includes('🌐 在线搜索')) DATA.dirNames.push('🌐 在线搜索');
    IDX = null;
    document.getElementById('onlineQ').value = '';
    render();
    toast(`在线搜索完成：新增 ${added}，跳过 ${skip}（剩余额度 ${rem ?? '?'}）`);
  }catch(e){ toast('网络错误：' + e.message); }
  finally{ btn.textContent = '🌐 搜索'; btn.disabled = false; }
}

  const qc = e.target.closest('[data-copy]');
  if(qc){ e.stopPropagation(); navigator.clipboard.writeText(qc.dataset.copy); toast('已复制链接'); return; }
  const tu = e.target.closest('[data-url]');
  if(tu){ window.open(tu.dataset.url, '_blank'); return; }
  const card = e.target.closest('.card,.row');
  if(card && card.dataset.k){ openDrawer(card.dataset.k); return; }
  const tr = e.target.closest('tr[data-k]');
  if(tr && !e.target.closest('input') && !e.target.closest('button')){ openDrawer(tr.dataset.k); }
});

/* ===== 页签 ===== */
const TABS = {lib:'mainLib', trend:'secTrend', insight:'secInsight', stats:'secStats', fav:'secFav'};
function setTab(t){
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  Object.keys(TABS).forEach(k => {
    const el = document.getElementById(TABS[k]);
    if(k === 'lib') el.style.display = (t === 'lib') ? '' : 'none';
    else el.classList.toggle('show', k === t);
  });
  document.getElementById('controls').classList.toggle('show', t === 'lib');
  document.querySelector('.hint').style.display = t === 'lib' ? '' : 'none';
  document.querySelector('.resbar').style.display = t === 'lib' ? '' : 'none';
  if(t === 'fav') renderFav();
  window.scrollTo({top:0});
  syncHash();
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => setTab(b.dataset.tab));

/* ===== 主题 ===== */
function setTheme(t){
  document.documentElement.dataset.theme = t;
  document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('gh_theme', t);
}
document.getElementById('themeBtn').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

/* ===== 键盘 ===== */
document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA'){
    if(e.key === 'Escape') e.target.blur();
    return;
  }
  if(e.key === '?' || e.key === '/'){
    e.preventDefault();
    if(e.key === '/'){ document.getElementById('q').focus(); return; }
    showHelp();
  }
  else if(e.key === 'Escape'){ closeAll(); }
  else if(e.key === 'ArrowLeft'){ document.getElementById('pgPrev').click(); }
  else if(e.key === 'ArrowRight'){ document.getElementById('pgNext').click(); }
  else if(e.key === 'f' || e.key === 'F'){ const c = document.getElementById('favOnly'); c.checked = !c.checked; state.favOnly = c.checked; render(); }
  else if(e.key === 't' || e.key === 'T'){ setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); }
  else if(e.key === 'c' || e.key === 'C'){ resetAll(); }
  else if(e.key === 'r' || e.key === 'R'){ document.getElementById('randBtn').click(); }
  else if(['1','2','3','4','5'].includes(e.key)){ setTab(['lib','trend','insight','stats','fav'][+e.key-1]); }
});

    <div class="mbody">
      <div class="kv" style="margin-bottom:14px">
        <div><div class="l">当前收录</div><div class="v">${fnum(ALL.length)}</div></div>
        <div><div class="l">方向分类</div><div class="v">${DATA.dirNames.length}</div></div>
        <div><div class="l">⭐ 带点评推荐</div><div class="v">${Object.keys(HLS).length}</div></div>
        <div><div class="l">数据更新</div><div class="v" style="font-size:12px">${DATA.generatedAt}</div></div>
      </div>
      <p style="font-size:13px"><b>基本用法</b></p>
      <ul style="font-size:12.5px;color:var(--muted)">
        <li>顶部搜索框：即时筛选，支持空格分隔多词（AND），命中处会高亮</li>
        <li>方向 / 语言标签：点一下筛选，再点取消；方向多可用「搜索方向」框找</li>
        <li>★ 滑块：只看某个 Star 量级以上的仓库</li>
        <li>排序选「🎲 随机」+「🔀 换一批」：随机发现没见过的项目</li>
        <li>☑ 本页对比 / ★ 本页收藏：批量操作当前页</li>
        <li>点卡片开详情：可收藏、加入对比、存成图片、看相似仓库、上/下一个</li>
        <li>🌐 在线搜索：填入关键词实时调 GitHub，结果并入本页（Token 按钮可提速率）</li>
        <li>筛选状态会写进网址，复制网址即可分享当前视图</li>
      </ul>
      <p style="font-size:13px;margin-top:12px"><b>快捷键</b></p>
      <div class="chips">${[['/','聚焦搜索'],['?','打开本说明'],['R','随机发现'],['F','仅看收藏'],
        ['← →','翻页'],['C','重置筛选'],['T','切换主题'],['1-5','切换页签'],['Esc','关闭弹层']]
        .map(([k,v])=>`<span class="chip"><kbd>${k}</kbd> ${v}</span>`).join('')}</div>
    </div>`;
  m.classList.add('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('hClose').onclick = closeAll;
}

/* ===== 启动 ===== */
function boot(){
  const bar = document.getElementById('bootBar'), tip = document.getElementById('bootTip');
  const total = ALL.length;
  tip.textContent = `正在准备 ${fnum(total)} 个仓库…`;
  bar.style.width = '35%';
  setTimeout(() => {
    setTheme(localStorage.getItem('gh_theme') || 'light');
    readHash();
    if(state.q) document.getElementById('q').value = state.q;
    if(state.view !== 'card') document.getElementById('viewSel').value = state.view;
    if(state.sort !== 'stars-desc') document.getElementById('sortSel').value = state.sort;
    renderTrend(); renderInsight(); renderStats(); renderFav(); renderHist();
    bar.style.width = '75%';
    tip.textContent = '正在渲染…';
    setTimeout(() => {
      render(); setTab('lib');
      bar.style.width = '100%';
      setTimeout(() => document.getElementById('boot').classList.add('hide'), 220);
    }, 30);
  }, 30);
}
boot();
</script>
